services:
  # Backend API service
  backend:
    build:
      context: .
      dockerfile: Dockerfile.server
    container_name: zc_chess_backend
    restart: unless-stopped
    ports:
      - "${PORT:-5000}:5000"
    env_file:
      - server/.env
    environment:
      - NODE_ENV=production
      - PORT=5000
    networks:
      - chess_network

  # Frontend Web service
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.client
    container_name: zc_chess_frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - chess_network

  # Optional local MongoDB service (uncomment to run entirely offline)
  # mongo:
  #   image: mongo:7-jammy
  #   container_name: zc_chess_mongo
  #   restart: unless-stopped
  #   ports:
  #     - "27017:27017"
  #   volumes:
  #     - mongo_data:/data/db
  #   networks:
  #     - chess_network

networks:
  chess_network:
    driver: bridge

volumes:
  mongo_data:
